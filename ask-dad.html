<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Ask Dad</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: #f5f5f5;
      color: #222;
    }
    header {
      text-align: center;
      margin-bottom: 16px;
    }
    h1 { margin: 0 0 8px; font-size: 1.6rem; }
    .avatar {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: #ddd;
      margin: 0 auto 12px;
      position: relative;
      overflow: hidden;
    }
    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    #conversation {
      background: white;
      border-radius: 12px;
      padding: 12px;
      min-height: 200px;
      max-height: 50vh;
      overflow-y: auto;
      margin-bottom: 16px;
      border: 1px solid #e0e0e0;
    }
    .msg {
      margin: 8px 0;
      padding: 8px 12px;
      border-radius: 12px;
      max-width: 85%;
    }
    .user { background: #e3f2fd; margin-left: auto; }
    .dad { background: #f1f8e9; }
    .input-area {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    #textInput {
      flex: 1;
      padding: 14px 16px;
      border: 1px solid #ccc;
      border-radius: 24px;
      font-size: 1.05rem;
      -webkit-appearance: none;
    }
    button {
      padding: 14px 18px;
      border: none;
      border-radius: 24px;
      background: #1976d2;
      color: white;
      font-size: 1.05rem;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    button:active { background: #1565c0; opacity: 0.9; }
    #voiceBtn { background: #388e3c; min-width: 90px; }
    #voiceBtn.listening { background: #d32f2f; }
    .note {
      text-align: center;
      font-size: 0.8rem;
      color: #666;
      margin-top: 12px;
    }
  </style>
</head>

    <p style="margin:0; font-size:0.9rem; color:#555;">AI in Dad’s style — not the real thing</p>
  <div style="margin: 12px auto; max-width: 420px; text-align:center;">
    <input id="apiKey" type="password" placeholder="Gemini API key (for replies)" style="width:100%; padding:10px; border-radius:8px; border:1px solid #ccc; font-size:0.95rem; margin-bottom:6px;">
    <input id="fishKey" type="password" placeholder="Fish Audio API key (for voice)" style="width:100%; padding:10px; border-radius:8px; border:1px solid #ccc; font-size:0.95rem;">
    <p style="font-size:0.75rem; color:#888; margin:4px 0 0;">Keys stay in your browser only.</p>
  </div>

  </header>

  <div id="conversation"></div>

  <div class="input-area">
    <button id="voiceBtn">🎤 Voice</button>
    <input id="textInput" type="text" placeholder="Or type here…" />
    <button id="sendBtn">Send</button>
  </div>
  <p class="note">Voice works best in Chrome on Android.<br>On iPhone, use the text box or check if Safari allows the mic.</p>

  <script>
    const conversation = document.getElementById('conversation');
    const textInput = document.getElementById('textInput');
    const voiceBtn = document.getElementById('voiceBtn');
    const sendBtn = document.getElementById('sendBtn');
    const apiKeyInput = document.getElementById('apiKey');
    const fishKeyInput = document.getElementById('fishKey');

    // Remember keys in this browser
    if (localStorage.getItem('geminiKey')) apiKeyInput.value = localStorage.getItem('geminiKey');
    if (localStorage.getItem('fishKey')) fishKeyInput.value = localStorage.getItem('fishKey');

    apiKeyInput.addEventListener('change', () => localStorage.setItem('geminiKey', apiKeyInput.value.trim()));
    fishKeyInput.addEventListener('change', () => localStorage.setItem('fishKey', fishKeyInput.value.trim()));
    apiKeyInput.addEventListener('input', () => localStorage.setItem('geminiKey', apiKeyInput.value.trim()));
    fishKeyInput.addEventListener('input', () => localStorage.setItem('fishKey', fishKeyInput.value.trim()));

    function addMessage(text, isUser) {
      const div = document.createElement('div');
      div.className = 'msg ' + (isUser ? 'user' : 'dad');
      div.textContent = text;
      conversation.appendChild(div);
      conversation.scrollTop = conversation.scrollHeight;
    }

    const SYSTEM_PROMPT = `You are Richard (Dad). Speak in a natural Australian voice — warm, direct, a bit of dry humour, never preachy.

Rules:
- No "how you doing", no "right mate", no movie quotes.
- Don't say "calm down" unless the person is clearly worked up.
- Don't overdo "I'm proud of you" on small things.
- Humour to ease tension, but only if it fits.
- Empathetic: treat people the way you'd want to be treated.
- Family is family — you don't have to take disrespect.
- Advice once or twice, then stop and let him decide.
- Research purchases properly; not always the cheapest.
- Straight apology when needed; no humour if they're not receptive.
- Don't delay — do today what can be done today.
- Think about how it will sit with him later and how it affects others.
- Trust that he'll make the right call.
- Keep answers short and conversational, like a phone chat.
- If unsure, say so plainly.

Address him casually. Sometimes he starts with "Hey Mord" or "Mord?".`;

    let history = [];

    async function respond(userText) {
      const key = document.getElementById('apiKey').value.trim();
      if (!key) {
        addMessage("Paste your free Gemini API key first (aistudio.google.com/apikey).", false);
        return;
      }

      history.push({ role: "user", parts: [{ text: userText }] });

      const body = {
        system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
        contents: history,
        generationConfig: { temperature: 0.8, maxOutputTokens: 300 }
      };

      try {
        const res = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${key}`,
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          }
        );
        const data = await res.json();
        if (!res.ok) {
          console.error("Gemini error:", data);
          throw new Error(data.error?.message || JSON.stringify(data).slice(0,200));
        }

        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || "Sorry mate, something went wrong.";
        history.push({ role: "model", parts: [{ text: reply }] });
        addMessage(reply, false);
        speak(reply);
      } catch (err) {
        console.error(err);
        addMessage("Couldn't reach Gemini: " + (err.message || err), false);
      }
    }

    const avatar = document.getElementById('avatar');

    const FISH_VOICE_ID = "e15da989a22944e4be3522d885c2d011";

    async function speak(text) {
      const fishKey = document.getElementById('fishKey').value.trim();
      if (!fishKey) {
        // fallback to browser voice
        if (!('speechSynthesis' in window)) return;
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'en-AU';
        speechSynthesis.speak(utter);
        return;
      }

      try {
        const res = await fetch("https://api.fish.audio/v1/tts", {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + fishKey,
            "Content-Type": "application/json",
            "model": "s2.1-pro-free"
          },
          body: JSON.stringify({
            text: text,
            reference_id: FISH_VOICE_ID,
            format: "mp3"
          })
        });
        if (!res.ok) throw new Error(await res.text());
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const audio = new Audio(url);
        audio.play();
      } catch (err) {
        console.error(err);
        // fallback
        if ('speechSynthesis' in window) {
          const utter = new SpeechSynthesisUtterance(text);
          utter.lang = 'en-AU';
          speechSynthesis.speak(utter);
        }
      }
    }

    // Load voices (some browsers need this)
    if ('speechSynthesis' in window) {
      speechSynthesis.onvoiceschanged = () => {};
    }

    function handleInput(text) {
      if (!text.trim()) return;
      addMessage(text.trim(), true);
      textInput.value = '';
      setTimeout(() => respond(text), 400);
    }

    sendBtn.addEventListener('click', () => handleInput(textInput.value));
    textInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleInput(textInput.value);
    });

    // Voice — note limited support on iOS Safari
    let recognition = null;
    const hasSpeech = 'webkitSpeechRecognition' in window || 'SpeechRecognition' in window;
    if (hasSpeech) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-AU';

      recognition.onstart = () => {
        voiceBtn.textContent = '🔴 Listening…';
        voiceBtn.classList.add('listening');
      };
      recognition.onend = () => {
        voiceBtn.textContent = '🎤 Voice';
        voiceBtn.classList.remove('listening');
      };
      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        handleInput(transcript);
      };
      recognition.onerror = (e) => {
        voiceBtn.textContent = '🎤 Voice';
        voiceBtn.classList.remove('listening');
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
          addMessage('(Mic permission needed — or just type instead)', false);
        }
      };

      voiceBtn.addEventListener('click', () => {
        if (voiceBtn.classList.contains('listening')) {
          recognition.stop();
        } else {
          try {
            recognition.start();
          } catch (err) {
            addMessage('(Voice not available on this browser — type instead)', false);
          }
        }
      });
    } else {
      voiceBtn.disabled = true;
      voiceBtn.textContent = 'Type instead';
      voiceBtn.style.background = '#999';
    }
  </script>
</body>
</html>
